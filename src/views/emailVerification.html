<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
</head>
<body style="background-color: #f3f4f6; padding: 2rem; font-family: Arial, sans-serif; color: #333; margin: 0;">
    <div style="max-width: 32rem; margin: 0 auto; background-color: #ffffff; padding: 2rem; border-radius: 0.75rem; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); text-align: center;">
        
        <img src="https://i.ibb.co/Jwp0xT4M/LOGO.jpg" alt="EIS" style="max-width: 8rem; margin-bottom: 1.5rem; border-radius: 16px;" />
        
        <h1 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 1rem; color: #1f2937;">
            Welcome to EIS VERSE
        </h1>
        
        <p style="color: #4b5563; margin-bottom: 1.5rem; line-height: 1.5;">
            Thank you for joining EIS! Your account is almost ready. Use the verification code below:
        </p>
        
        <div style="background: linear-gradient(135deg, #111111, #ffa703); color: #ffffff; padding: 1rem; border-radius: 0.5rem; font-size: 2rem; font-weight: 800; letter-spacing: 0.2rem; margin-bottom: 1.5rem; box-shadow: 0 4px 10px rgba(255, 167, 3, 0.3);">
            {{otp}}
        </div>
        
        <p style="color: #4b5563; font-size: 0.9rem; margin-bottom: 1rem;">
            Collect this code to verify your account.
        </p>
        
        <p style="color: #ff3b30; font-size: 0.85rem; margin-bottom: 1.5rem; font-weight: 500;">
            ⏰ This code expires in <strong>3 minutes</strong>.
        </p>
        
        <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 1.5rem 0;" />
        
        <a href="https://shadat-hossain.netlify.app" style="color: #9ca3af; font-size: 12px; text-decoration: none;" target="_blank">
            ᯤ Developed by EIS ᯤ
        </a>
    </div>
</body>
</html>
